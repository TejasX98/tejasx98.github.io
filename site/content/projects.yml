- id: warehouse-automation
  title: Robotic Warehouse Automation — PLC Control Software
  category: Work
  date: 2020 – 2022
  summary: PLC control software and on-site commissioning for ASRS, conveyors and AGVs across 5+ large warehouse automation projects at Wipro PARI.
  role: Graduate trainee → field service engineer → controls software engineer (R&D).
  tags: [Siemens S7-1200/1500, TIA Portal, SCL, Ladder, Commissioning, OPC UA]
  featured: true
  cover: media/projects/warehouse-automation/cover.svg
  details: |
    **What I did**
    - Wrote and modified PLC control software (Siemens S7-1200/1500, TIA Portal, SCL and Ladder, to IEC 61131-3) for 5+ large robotic warehouse projects
    - Designed control sequences and safety interlocks for conveyors, ASRS and material-handling AGVs
    - Integrated PLCs with TP1500 HMIs, VFDs and field devices, and linked them to WMS/WCS and MES over OPC UA, TCP/IP and EtherNet/IP
    - Commissioned conveyors, ASRS, manipulators, lifters, RFID and Cognex vision at automotive and pharmaceutical client sites
    - Wrote FAT/SAT procedures and supported DQ/IQ/OQ/PQ validation on pharma projects

    **Results**
    - Throughput raised from **140 to 300+ pallets/hour** by optimising existing PLC programs
    - System uptime up **15%** after breakdown analysis and logic rework with the design team
    - Breakdown time cut by about **25%** through root-cause analysis and design changes
    - Customer appreciation (2021) for delivering a robotic warehousing project ahead of schedule

    *Client names and site photos are left out for confidentiality.*
  links: []
  media: []

- id: quadruped-robot
  title: Quadruped Robot with Machine-Vision Path Planning
  category: Competition
  date: '2019'
  summary: Four-legged robot with coordinated gait control and vision-based path planning. ABU Robocon 2019 Special Jury Award, National Rank 4. Published at IEEE PuneCon 2019.
  role: Technical In-Charge of the lab team — control logic for leg coordination, actuator integration, slope/step testing.
  team: GCOER Robotics Research Lab
  tags: [Embedded control, Kinematics, Machine vision, C++, Arduino]
  featured: true
  cover: media/projects/quadruped-robot/cover.jpg
  details: |
    **Problem.** Wheeled robots struggle on uneven ground. The contest needed a legged robot that stays stable over slopes and steps.

    **What I did**
    - Designed the control logic that coordinates all four legs
    - Integrated the actuator drives with the controller network (master + slave controllers)
    - Tested on slope and step obstacles and tuned the gait

    **Solution.** A master controller sends gait commands to slave controllers, one pair of legs each. Leg-length kinematics turn foot positions into actuator lengths, and an image-processing block handles path detection.

    **Result.** **Special Jury Award and National Rank 4** at ABU Robocon 2019. Paper: *Design and Control of Quadruped Robot with Machine Vision based Path Planning*, IEEE PuneCon 2019.
  links:
    - {label: Paper on IEEE Xplore, url: 'https://ieeexplore.ieee.org/document/9105783'}
  media:
