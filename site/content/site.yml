about: |
  I'm an Instrumentation & Control engineer with a background in warehouse and pharma automation, now working in inventory quality at a high-volume fulfilment centre.

  At **Wipro PARI** I spent two years on robotic warehousing, ASRS and automated car-parking projects - from graduate engineer, to on-site commissioning, to controls software. That meant writing and fixing PLC logic in Siemens TIA Portal, bringing conveyors, ASRS, lifters and vision systems online, running FAT/SAT and IQ/OQ/PQ, and training operators at handover. Reworking the sequencing logic on one pallet system took throughput from 140 to over 300 pallets an hour.

  After my **MSc in Engineering Management** at the University of Leicester I joined **Cainiao**, starting as an Inventory Associate in Leicester and promoted to **ICQA Supervisor** to help open the new Daventry fulfilment centre — stock investigations, audits, root-cause analysis and corrective actions, backed by data.

