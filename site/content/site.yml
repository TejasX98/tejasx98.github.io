about: |
  I build and fix systems that move things reliably — conveyors, ASRS, AGVs — and the PLC logic and data that keep them honest.

  At **Wipro PARI** I wrote and modified PLC control software (Siemens S7-1200/1500, TIA Portal) for large robotic warehouse projects and commissioned conveyors, ASRS and vision systems at automotive and pharmaceutical sites.

  I now lead **ICQA at Cainiao's Daventry site**, using WMS data, root-cause analysis and process changes to cut inventory discrepancies.

